<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Daily Vocabulary Checking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- THANH TRÊN CÙNG -->
  <header class="topbar">
    <div class="brand">Daily Vocabulary Checking · Admin</div>
    <div class="right hidden" id="topbar-right">
      <button class="btn btn-light" id="btn-logout" type="button">Đăng xuất</button>
    </div>
  </header>

  <main class="container">

    <!-- MÀN HÌNH 1: ĐĂNG NHẬP ADMIN -->
    <section class="screen" id="screen-login">
      <div class="card narrow">
        <h1>Đăng nhập quản trị</h1>
        <div class="form-group">
          <label for="admin-password">Mật khẩu</label>
          <input type="password" id="admin-password" placeholder="Nhập mật khẩu Admin" autocomplete="current-password">
        </div>
        <div class="msg msg-error hidden" id="login-msg"></div>
        <button class="btn btn-primary btn-block" id="btn-login" type="button">Đăng nhập</button>
      </div>
    </section>

    <!-- MÀN HÌNH 2: QUẢN TRỊ -->
    <section class="screen hidden" id="screen-admin">

      <div class="tabs">
        <button class="tab-btn active" id="tabbtn-config" type="button">Cập nhật đề</button>
        <button class="tab-btn" id="tabbtn-results" type="button">Kết quả học sinh</button>
      </div>

      <!-- TAB 1: CẬP NHẬT ĐỀ -->
      <div id="panel-config">
        <div class="card">
          <h2>Đề hôm nay</h2>
          <p class="muted" id="current-info">Đang tải cấu hình hiện tại...</p>

          <div class="form-group">
            <label for="cfg-csv">Link CSV (Google Sheets → Phát hành lên web → CSV)</label>
            <input type="url" id="cfg-csv" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?gid=...&single=true&output=csv">
          </div>
          <div class="form-group">
            <label for="cfg-topic">Tên chủ đề</label>
            <input type="text" id="cfg-topic" placeholder="Ví dụ: Crime And Punishment" maxlength="100">
          </div>
          <div class="form-group">
            <label for="cfg-duration">Thời gian làm bài (phút)</label>
            <input type="number" id="cfg-duration" min="1" max="180" value="15">
          </div>

          <div class="msg hidden" id="config-msg"></div>

          <div class="toolbar" style="justify-content:flex-start;">
            <button class="btn btn-secondary" id="btn-test-csv" type="button">Kiểm tra link CSV</button>
            <button class="btn btn-primary" id="btn-save-config" type="button">Cập nhật đề hôm nay</button>
          </div>
        </div>
      </div>

      <!-- TAB 2: KẾT QUẢ -->
      <div class="hidden" id="panel-results">
        <div class="card">
          <div class="toolbar">
            <div class="toolbar" style="margin:0;">
              <select id="filter-topic" style="width:auto;">
                <option value="">Tất cả chủ đề</option>
              </select>
              <select id="sort-by" style="width:auto;">
                <option value="newest">Mới nhất</option>
                <option value="score">Điểm cao nhất</option>
                <option value="fastest">Làm nhanh nhất</option>
              </select>
            </div>
            <div class="toolbar" style="margin:0;">
              <label class="muted"><input type="checkbox" id="auto-refresh" checked> Tự làm mới 30 giây</label>
              <button class="btn btn-secondary" id="btn-refresh" type="button">Làm mới</button>
              <button class="btn btn-secondary" id="btn-export" type="button">Xuất CSV</button>
            </div>
          </div>
          <div class="muted" id="results-count"></div>
          <div class="msg msg-error hidden" id="results-msg"></div>
        </div>

        <div class="table-wrap scroll-x">
          <table class="admin-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Thời gian nộp</th>
                <th>Họ tên</th>
                <th>Chủ đề</th>
                <th>Điểm</th>
                <th>Tỉ lệ</th>
                <th>Thời gian làm</th>
                <th>Chi tiết câu sai</th>
              </tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>
      </div>

    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/csv-parser.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
